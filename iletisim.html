<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İletişim | KED SAVUNMA Havacılık A.Ş.</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f8f9fa; margin: 0; }
        .container { max-width: 700px; margin: 3rem auto; background: #fff; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,30,60,0.08); padding: 2.5rem; }
        h1 { color: #8B0000; text-align: center; margin-bottom: 2rem; }
        .contact-info { font-size: 1.1rem; margin-bottom: 2rem; }
        .contact-item { display: flex; align-items: center; margin-bottom: 1.5rem; }
        .contact-item i { font-size: 1.5rem; margin-right: 1rem; color: #8B0000; }
        .contact-form { background: #f3f3f3; padding: 2rem; border-radius: 10px; }
        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 500; }
        .form-group input, .form-group textarea { width: 100%; padding: 0.8rem; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; }
        .form-group textarea { height: 100px; }
        .submit-btn { width: 100%; padding: 1rem; background: linear-gradient(45deg, #8B0000, #DC143C); color: #fff; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: 600; cursor: pointer; transition: all 0.3s; }
        .submit-btn:hover { background: #B22222; }
    </style>
</head>
<body>
    <div class="container">
        <h1>İletişim</h1>
        <div class="contact-info">
            <div class="contact-item"><i class="fas fa-map-marker-alt"></i> <div><strong>Adres:</strong> Ankara, Türkiye</div></div>
            <div class="contact-item"><i class="fas fa-phone"></i> <div><strong>Telefon:</strong> +90 (312) XXX XX XX</div></div>
            <div class="contact-item"><i class="fas fa-envelope"></i> <div><strong>E-posta:</strong> info@kedsavunma.com</div></div>
            <div class="contact-item"><i class="fas fa-clock"></i> <div><strong>Çalışma Saatleri:</strong> Pazartesi - Cuma: 09:00 - 18:00</div></div>
        </div>
        <div class="contact-form">
            <h3>Mesaj Gönderin</h3>
            <form id="contact-form">
                <div class="form-group">
                    <label for="name">Ad Soyad</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="email">E-posta</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="phone">Telefon</label>
                    <input type="tel" id="phone" name="phone">
                </div>
                <div class="form-group">
                    <label for="message">Mesajınız</label>
                    <textarea id="message" name="message" required></textarea>
                </div>
                <button type="submit" class="submit-btn">Mesaj Gönder</button>
            </form>
        </div>
    </div>
    <script>
        document.getElementById('contact-form').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Mesajınız alındı! En kısa sürede size dönüş yapacağız.');
            this.reset();
        });
    </script>
</body>
</html>
